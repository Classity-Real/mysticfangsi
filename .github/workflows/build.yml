name: MysticGSI Build

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Name for the build (out/<name>/)'
        required: true
        default: 'devicename-gsi'
      firmware_url:
        description: 'Firmware URL (Google Drive, Mega.nz, or direct link)'
        required: true
        default: ''
      rom_type:
        description: 'ROM patch set (--type), leave empty for generic'
        required: false
        default: ''
      rom_name:
        description: 'ROM name shown in Telegram post (e.g. XOS, OneUI, MIUI)'
        required: true
        default: ''
      telegram_photo_url:
        description: 'Photo URL for Telegram post header (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -a -f || true
          df -h

      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Debug - list checkout contents
        run: |
          pwd
          ls -la

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-venv erofs-utils aria2 patch \
            default-jre-headless curl build-essential cmake ninja-build pkg-config \
            perl golang-go libgtest-dev libusb-1.0-0-dev libpcre2-dev \
            libprotobuf-dev protobuf-compiler libbrotli-dev liblz4-dev libzstd-dev \
            libarchive-tools openssl file p7zip-full unrar-free xz-utils

      - name: Install apktool
        run: |
          mkdir -p ~/.local/bin
          ver=$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
            | grep -oP '"tag_name": "v\K[^"]+')
          curl -fL -o ~/.local/bin/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${ver}/apktool_${ver}.jar"
          printf '#!/bin/sh\nexec java -jar "$HOME/.local/bin/apktool.jar" "$@"\n' \
            > ~/.local/bin/apktool
          chmod +x ~/.local/bin/apktool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run setup
        run: |
          chmod +x setup_host.py
          python3 setup_host.py

      - name: Download firmware
        run: |
          URL="${{ github.event.inputs.firmware_url }}"
          mkdir -p dl
          echo "URL: $URL"
          case "$URL" in
            *drive.google.com*)
              echo "Source: Google Drive"
              .venv/bin/python -m pip install -q gdown
              mkdir -p ~/.cache/gdown
              if [ -n "${{ secrets.GDRIVE_COOKIES }}" ]; then
                echo "${{ secrets.GDRIVE_COOKIES }}" > ~/.cache/gdown/cookies.txt
              fi
              .venv/bin/python -m gdown --fuzzy "$URL" -O dl/
              ;;
            *mega.nz*|*mega.co.nz*)
              echo "Source: Mega.nz"
              sudo apt-get install -y megatools
              megadl --path dl/ "$URL"
              ;;
            *)
              echo "Source: direct link"
              aria2c -d dl -x4 -s4 "$URL"
              ;;
          esac
          echo "Downloaded:"
          find dl -maxdepth 1 -type f -exec ls -lh {} \;

      - name: Locate firmware file for CLI
        run: |
          DL_FILE=$(find dl -maxdepth 1 -type f | head -n1)
          if [ -z "$DL_FILE" ]; then
            echo "ERROR: no file in dl/"
            exit 1
          fi
          echo "Downloaded file: $DL_FILE"

          MIME=$(file -b --mime-type "$DL_FILE")
          echo "MIME: $MIME"

          extract_archive() {
            local src="$1" dst="$2"
            mkdir -p "$dst"
            local m
            m=$(file -b --mime-type "$src")
            case "$m" in
              application/zip|application/java-archive|application/x-zip-compressed|application/x-zip)
                unzip -o "$src" -d "$dst" ;;
              application/x-7z-compressed)
                7z x "$src" -o"$dst" ;;
              application/x-rar*|application/vnd.rar)
                unrar-free x "$src" "$dst"/ 2>/dev/null || 7z x "$src" -o"$dst" ;;
              application/x-tar|application/gzip|application/x-bzip2|application/x-xz)
                tar -xf "$src" -C "$dst" ;;
              *)
                case "${src##*.}" in
                  zip|apk|jar) unzip -o "$src" -d "$dst" ;;
                  7z)          7z x "$src" -o"$dst" ;;
                  rar)         unrar-free x "$src" "$dst"/ 2>/dev/null || 7z x "$src" -o"$dst" ;;
                  tar|tgz|gz|bz2|xz) tar -xf "$src" -C "$dst" ;;
                  *)
                    if unzip -t "$src" >/dev/null 2>&1; then
                      unzip -o "$src" -d "$dst"
                    else
                      cp "$src" "$dst/"
                    fi ;;
                esac ;;
            esac
          }

          detect_in_dir() {
            local D="$1"
            DETECTED_FILE=""
            DETECTED_TYPE=""
            NESTED_ZIP=""

            local HW KDZ OZIP SIN SAM_AP SAM_ANY PAC QFIL PAYLOAD SUPER SYSDAT IMGZIP SYSIMG IMG NZIP
            HW=$(find "$D"       -iname 'UPDATE.APP'                             | head -n1)
            KDZ=$(find "$D"      -iname '*.kdz'                                  | head -n1)
            OZIP=$(find "$D"     -iname '*.ozip'                                 | head -n1)
            SIN=$(find "$D"      -iname '*.sin'                                  | head -n1)
            SAM_AP=$(find "$D" \( -iname 'AP_*.tar.md5' -o -iname 'AP_*.tar' \) | head -n1)
            SAM_ANY=$(find "$D" \( -iname '*.tar.md5'   -o -iname '*.tar'    \) | head -n1)
            PAC=$(find "$D"      -iname '*.pac'                                  | head -n1)
            QFIL=$(find "$D"     -iname 'rawprogram*.xml'                        | head -n1)
            PAYLOAD=$(find "$D"  -iname 'payload.bin'                            | head -n1)
            SUPER=$(find "$D"    -iname 'super*.img' ! -iname 'super_empty*.img' | head -n1)
            SYSDAT=$(find "$D"   -iname 'system.new.dat'                         | head -n1)

            IMGZIP=$(find "$D" \( -iname 'image-*.zip' -o -iname '*-image-*.zip' \) | head -n1)
            SYSIMG=$(find "$D" \( -iname 'system.img' -o -iname 'system_a.img' -o -iname 'system_b.img' -o -iname 'system-*.img' \) | head -n1)
            IMG=$(find "$D" -iname '*.img' ! -iname 'bootloader*.img' ! -iname 'vbmeta*.img' ! -iname 'dtbo*.img' ! -iname 'dtb*.img' ! -iname 'modem*.img' ! -iname 'radio*.img' | head -n1)
            NZIP=$(find "$D" -iname '*.zip' | head -n1)

            if   [ -n "$HW"      ]; then DETECTED_FILE="$HW";                  DETECTED_TYPE="Huawei UPDATE.APP"
            elif [ -n "$KDZ"     ]; then DETECTED_FILE="$KDZ";                 DETECTED_TYPE="LG KDZ"
            elif [ -n "$OZIP"    ]; then DETECTED_FILE="$OZIP";                DETECTED_TYPE="Oppo OZIP"
            elif [ -n "$SIN"     ]; then DETECTED_FILE="$SIN";                 DETECTED_TYPE="Sony SIN"
            elif [ -n "$SAM_AP"  ]; then DETECTED_FILE="$SAM_AP";              DETECTED_TYPE="Samsung AP tar"
            elif [ -n "$SAM_ANY" ]; then DETECTED_FILE="$SAM_ANY";             DETECTED_TYPE="Samsung tar"
            elif [ -n "$PAC"     ]; then DETECTED_FILE="$PAC";                 DETECTED_TYPE="Unisoc PAC"
            elif [ -n "$QFIL"    ]; then DETECTED_FILE="$(dirname "$QFIL")";   DETECTED_TYPE="QFIL package dir"
            elif [ -n "$PAYLOAD" ]; then DETECTED_FILE="$DL_FILE";             DETECTED_TYPE="OTA zip (payload.bin)"
            elif [ -n "$SUPER"   ]; then DETECTED_FILE="$SUPER";               DETECTED_TYPE="super.img"
            elif [ -n "$SYSDAT"  ]; then DETECTED_FILE="$(dirname "$SYSDAT")"; DETECTED_TYPE="system.new.dat dir"
            elif [ -n "$SYSIMG"  ]; then DETECTED_FILE="$SYSIMG";              DETECTED_TYPE="system.img"
            elif [ -n "$IMGZIP"  ]; then DETECTED_FILE="";                     DETECTED_TYPE="nested image-*.zip"
            elif [ -n "$IMG"     ]; then DETECTED_FILE="$IMG";                 DETECTED_TYPE="*.img fallback"
            fi

            if [ -n "$IMGZIP" ]; then
              NESTED_ZIP="$IMGZIP"
            else
              NESTED_ZIP="$NZIP"
            fi
          }

          FIRMWARE_FILE=""

          case "$DL_FILE" in
            *.kdz|*.ozip|*.sin|*.pac|*.tar.md5)
              FIRMWARE_FILE="$DL_FILE"
              echo "Direct firmware format detected by extension." ;;
          esac

          if [ -z "$FIRMWARE_FILE" ]; then
            case "$MIME" in
              application/x-tar)
                FIRMWARE_FILE="$DL_FILE"
                echo "Direct tar firmware detected by MIME." ;;
            esac
          fi

          if [ -z "$FIRMWARE_FILE" ]; then
            echo "Extracting outer archive..."
            extract_archive "$DL_FILE" firmware_extracted
            echo "Contents after extraction:"
            find firmware_extracted -maxdepth 5 -type f | sort | head -80

            detect_in_dir firmware_extracted
            echo "First-pass detection: type='$DETECTED_TYPE'  file='$DETECTED_FILE'"

            if [ -z "$DETECTED_FILE" ] && [ -n "$NESTED_ZIP" ]; then
              EXTRACTED_COUNT=$(find firmware_extracted -type f | wc -l)
              if [ "$EXTRACTED_COUNT" -eq 1 ]; then
                echo "Extraction was a no-op copy - force-unzipping: $NESTED_ZIP"
                mkdir -p firmware_extracted_force
                unzip -o "$NESTED_ZIP" -d firmware_extracted_force
                echo "Contents after force-unzip:"
                find firmware_extracted_force -maxdepth 5 -type f | sort | head -80
                detect_in_dir firmware_extracted_force
                echo "Force-unzip detection: type='$DETECTED_TYPE'  file='$DETECTED_FILE'"
                [ -n "$DETECTED_FILE" ] && NESTED_ZIP=""
              fi
            fi

            if [ -z "$DETECTED_FILE" ] && [ -n "$NESTED_ZIP" ]; then
              echo "No firmware found; extracting nested zip: $NESTED_ZIP"
              extract_archive "$NESTED_ZIP" firmware_extracted_inner
              echo "Contents after nested extraction:"
              find firmware_extracted_inner -maxdepth 5 -type f | sort | head -80
              detect_in_dir firmware_extracted_inner
              echo "Second-pass detection: type='$DETECTED_TYPE'  file='$DETECTED_FILE'"
            fi

            if [ -z "$DETECTED_FILE" ]; then
              echo "ERROR: no recognizable firmware artifact found. Full listing:"
              find firmware_extracted -type f | sort
              exit 1
            fi

            FIRMWARE_FILE="$DETECTED_FILE"
          fi

          echo "FIRMWARE_FILE=$FIRMWARE_FILE" >> "$GITHUB_ENV"
          echo "Firmware type : $DETECTED_TYPE"
          echo "Firmware path : $FIRMWARE_FILE"
          ls -lh "$FIRMWARE_FILE" 2>/dev/null || echo "(directory - passed as-is to cli.py)"

      - name: Build GSI
        run: |
          TYPE_ARG=""
          if [ -n "${{ github.event.inputs.rom_type }}" ]; then
            TYPE_ARG="--type ${{ github.event.inputs.rom_type }}"
          fi
          .venv/bin/python cli.py build "${{ github.event.inputs.build_name }}" \
            "$FIRMWARE_FILE" $TYPE_ARG

      - name: Compress output with xz -9e
        run: |
          OUT_DIR="out/${{ github.event.inputs.build_name }}"
          ls -lh "$OUT_DIR"
          find "$OUT_DIR" -maxdepth 1 -iname '*.img' -print0 \
            | while IFS= read -r -d '' f; do
                echo "Compressing: $f"
                xz -9e -T0 -v "$f"
                XZ="${f}.xz"
                SIZE=$(stat -c%s "$XZ")
                if [ "$SIZE" -gt 1900000000 ]; then
                  echo "Asset is $(( SIZE / 1048576 )) MiB - splitting into 1.9 GiB chunks"
                  split -b 1900M "$XZ" "${XZ}."
                  rm "$XZ"
                  ls -lh "${XZ}."*
                else
                  echo "Asset is $(( SIZE / 1048576 )) MiB - no split needed"
                fi
              done
          ls -lh "$OUT_DIR"

      - name: Prepare release tag
        id: tag
        run: |
          echo "tag=gsi-${{ github.event.inputs.build_name }}-$(date +%Y%m%d%H%M%S)" \
            >> "$GITHUB_OUTPUT"

      - name: Publish release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ github.event.inputs.build_name }}
          body: |
            To reassemble split parts (*.xz.aa, *.xz.ab, ...):
            ```
            cat *.xz.* > system.img.xz && xz -d system.img.xz
            ```
            Single-file releases need no reassembly.
          files: |
            out/${{ github.event.inputs.build_name }}/*.xz*
            out/${{ github.event.inputs.build_name }}/*.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          OUT_DIR="out/${{ github.event.inputs.build_name }}"
          OUTPUT_TXT="$OUT_DIR/output.txt"

          DEVICE_NAME=""
          if [ -f "$OUTPUT_TXT" ]; then
            DEVICE_NAME=$(grep -i "^Device name:" "$OUTPUT_TXT" 2>/dev/null \
              | head -n1 | cut -d: -f2- | xargs 2>/dev/null || true)
            if [ -z "$DEVICE_NAME" ]; then
              BRAND=$(grep -i "^Device brand:" "$OUTPUT_TXT" | head -n1 | cut -d: -f2- | xargs || true)
              MODEL=$(grep -i "^Device model:" "$OUTPUT_TXT" | head -n1 | cut -d: -f2- | xargs || true)
              DEVICE_NAME="${BRAND} ${MODEL}"
            fi
          fi
          [ -z "$DEVICE_NAME" ] && DEVICE_NAME="${{ github.event.inputs.build_name }}"

          OUTPUT_CONTENT=""
          [ -f "$OUTPUT_TXT" ] && OUTPUT_CONTENT=$(head -c 700 "$OUTPUT_TXT")

          RELEASE_URL="${{ steps.release.outputs.url }}"
          [ -z "$RELEASE_URL" ] && \
            RELEASE_URL="https://github.com/${{ github.repository }}/releases"

          ROM_NAME="${{ github.event.inputs.rom_name }}"
          PHOTO_URL="${{ github.event.inputs.telegram_photo_url }}"

          CAPTION="<b>MysticFGSI: Fan Generic System Images</b>
          <b>Ported From:</b> ${DEVICE_NAME}
          <b>ROM:</b> ${ROM_NAME}

          <code>${OUTPUT_CONTENT}</code>

          <b>Download:</b> <a href=\"${RELEASE_URL}\">GitHub</a>"

          if [ -n "$PHOTO_URL" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
              -H "Content-Type: application/json" \
              -d "{
                \"chat_id\": \"${CHAT_ID}\",
                \"photo\": \"${PHOTO_URL}\",
                \"caption\": $(echo "$CAPTION" | jq -Rs .),
                \"parse_mode\": \"HTML\"
              }"
          else
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{
                \"chat_id\": \"${CHAT_ID}\",
                \"text\": $(echo "$CAPTION" | jq -Rs .),
                \"parse_mode\": \"HTML\"
              }"
          fi